packages:
  - packages/*

# Isolate Eve's Node 24 framework and peers from core's Node 22 install.
sharedWorkspaceLockfile: false

packageConfigs:
  "@zackbart/connecta-eve":
    overrides:
      "eve@0.83.0>undici": 8.12.3

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - eve@0.83.0
