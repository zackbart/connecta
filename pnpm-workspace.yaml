packages:
  - packages/*

# Isolate Eve's Node 24 framework and peers from core's Node 22 install.
sharedWorkspaceLockfile: false

# Eve 0.84.0 pins vulnerable undici 8.10.2; remove once Eve pins undici >=8.12.2.
packageConfigs:
  "@zackbart/connecta-eve":
    overrides:
      "eve@0.84.0>undici": 8.12.3

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - eve@0.84.0
