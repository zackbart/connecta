# One service, no database server: state is one SQLite file on a named volume.
#
#   cp .env.example .env
#   docker compose build
#   docker compose run --rm --no-deps connecta npm run --silent provision-token -- "machine-name"
#   docker compose up -d --build
#
# Compose reads `.env` from this directory, so one file configures both the
# build and the container.

services:
  connecta:
    build: .
    # An init process reaps the QuickJS children a program leaves behind.
    init: true
    ports:
      - "${PORT:-8787}:${PORT:-8787}"
    environment:
      # accessTokens(storage) is always installed; an empty database is closed.
      # CONNECTA_TOKEN belongs to clients and is never configured on this server.
      PORT: ${PORT:-8787}
      # Downstream OAuth calls back to this origin. Unset is fine until this
      # deployment is reachable from somewhere other than this machine.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Keep the database under /data so it lands on the volume below.
      CONNECTA_DATABASE: ${CONNECTA_DATABASE:-/data/connecta.sqlite}
      # Optional modules. Each switches its module in src/connecta.config.ts
      # on when set and off when empty.
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CONNECTA_CREDENTIAL_KEY: ${CONNECTA_CREDENTIAL_KEY:-}
      CONNECTA_ACTIVITY: ${CONNECTA_ACTIVITY:-}
    volumes:
      - connecta-state:/data
    restart: unless-stopped

volumes:
  connecta-state:
