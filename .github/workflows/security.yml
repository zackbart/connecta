name: Security

# Advisories land upstream without a commit here. Pull requests audit only
# dependency changes, so this run notices new advisories against main, and
# publishing still refuses a release that fails the same audit.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check:security
