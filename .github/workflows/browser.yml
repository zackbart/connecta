name: Browser

# UI changes get immediate browser feedback. Other changes run on main/nightly.
on:
  pull_request:
    paths:
      - "src/operator-ui/**"
      - "test/browser/**"
      - "playwright*.config.*"
      - ".github/workflows/browser.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read installed Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      # Even a cache hit needs the runner's system libraries.
      - name: Install Chromium and system dependencies
        id: install
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm run test:browser:install --with-deps
      # A timed-out first attempt can leave apt-get holding the dpkg lock.
      - name: Retry Chromium installation once
        if: steps.install.outcome == 'failure'
        timeout-minutes: 9
        run: |
          bash scripts/ci-settle-apt.sh
          pnpm run test:browser:install --with-deps
      - name: Run browser tests
        run: pnpm run test:browser
      # test-results/ holds output only for failed attempts, flaky ones included.
      # A run that fails before any test still uploads its HTML report.
      - name: Upload Playwright report, diffs and traces
        if: ${{ !cancelled() && (failure() || hashFiles('test-results/**') != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
