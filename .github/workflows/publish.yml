name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<package-version> tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          node <<'NODE'
            const version = require("./package.json").version;
            const helperVersion = require("./packages/connecta-eve/package.json").version;
            if (helperVersion !== version) throw new Error("Connecta and connecta-eve versions must match");
            const expected = `v${version}`;
            if (process.env.RELEASE_TAG !== expected) {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} must equal ${expected}`);
            }
          NODE
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - name: Install Chromium and system dependencies
        timeout-minutes: 16
        uses: ./.github/actions/install-chromium
      - name: Validate core on its supported CI runtime
        run: pnpm run release:check:core
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/connecta-eve/pnpm-lock.yaml
      - run: pnpm --filter @zackbart/connecta-eve install --frozen-lockfile
      - name: Validate Eve on Node 24
        run: pnpm run release:check:eve
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@^11.5.1
      # Checks built both dist/ trees. Publish the helper first; a rerun skips
      # either version already published and completes a partially failed release.
      - name: Publish Eve helper unless already published
        working-directory: packages/connecta-eve
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already on npm"
          else
            npm publish --ignore-scripts --provenance
          fi
      - name: Publish core unless already published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already on npm"
          else
            npm publish --ignore-scripts --provenance
          fi
