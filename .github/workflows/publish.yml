name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<package-version> tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@^11.5.1
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          node -e '
            const version = require("./package.json").version;
            const expected = `v${version}`;
            if (process.env.RELEASE_TAG !== expected) {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} must equal ${expected}`);
            }
          '
      - run: npm ci
      - name: Read installed Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      # Publishing always runs Chromium, including npm publish's prepack check.
      - name: Install Chromium and system dependencies
        id: install
        timeout-minutes: 5
        continue-on-error: true
        run: npm run test:browser:install -- --with-deps
      - name: Retry Chromium installation once
        if: steps.install.outcome == 'failure'
        timeout-minutes: 5
        run: npm run test:browser:install -- --with-deps
      - run: npm run release:check
      - run: npm publish
