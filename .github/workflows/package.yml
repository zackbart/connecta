name: Package smoke

# Networked consumer and Docker installs are outside the required PR gate.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:examples
      # Pack the existing dist/ with --ignore-scripts, without another build.
      - run: pnpm run check:package
