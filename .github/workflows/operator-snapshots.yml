name: Operator snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:browser:install -- --with-deps
      - run: npm run test:browser:snapshots
      - uses: actions/upload-artifact@v6
        with:
          name: operator-linux-snapshots
          path: test/browser/operator-visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7
