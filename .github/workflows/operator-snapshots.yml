name: Operator snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        timeout-minutes: 16
        uses: ./.github/actions/install-chromium
      - run: pnpm run test:browser:snapshots
      - uses: actions/upload-artifact@v6
        with:
          name: operator-linux-snapshots
          path: test/browser/operator-visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7
