name: Provider drift

# Public vendor contracts only. This workflow reports evidence and never
# participates in CI's check gate or accepts a new baseline. Every run scans
# every public provider: weekly, on demand, and
# for pull requests that touch providers or the drift tooling.
on:
  pull_request:
    paths:
      - "src/providers/**"
      - "scripts/drift-*.mjs"
      - "scripts/generate-openapi.mjs"
      - "scripts/providers.mjs"
      - "scripts/value-safety.mjs"
      - "scripts/vercel-inventory.mjs"
      - ".github/workflows/provider-drift.yml"
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR evidence need not finish; scheduled/manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compare public provider contracts
        id: report
        continue-on-error: true
        run: pnpm --silent run providers:check --json > "$RUNNER_TEMP/provider-drift.json" 2> "$RUNNER_TEMP/provider-drift.log"
      - name: Summarize advisory findings
        if: always()
        env:
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { REPORT_OUTCOME: outcome, RUNNER_TEMP, GITHUB_STEP_SUMMARY } = process.env;
          let summary = '## Provider drift (advisory)\n\nPublic contracts only. No credentials, operational tool calls, issue filing, or baseline updates. This job is outside the aggregate `check` gate.\n\n';
          try {
            const report = JSON.parse(readFileSync(join(RUNNER_TEMP, 'provider-drift.json'), 'utf8'));
            // manual-required repeats every run until a vendor publishes a contract;
            // everything else is new or changed against the reviewed evidence.
            const lines = [];
            const standing = [];
            for (const mode of ['specs', 'docs', 'manual', 'records'])
              for (const row of report[mode]) {
                for (const finding of row.findings)
                  (finding.kind === 'manual-required' ? standing : lines).push(`${row.provider} (${mode}): ${finding.kind} ${finding.detail}`);
                for (const tool of row.added ?? []) lines.push(`${row.provider} (${mode}): unclassified ${tool}`);
                for (const tool of row.removed ?? []) lines.push(`${row.provider} (${mode}): not documented ${tool}`);
              }
            const list = (items) => !items.length ? 'None.\n' : items.slice(0, 50).map((item) => `- ${item.replace(/\s+/g, ' ')}\n`).join('') + (items.length > 50 ? `- …and ${items.length - 50} more in the attached JSON\n` : '');
            summary += `### ${lines.length} new or changed finding(s)\n\nContract changes, unavailable references, and invalid records against the reviewed evidence.\n\n${list(lines)}\n`;
            summary += `### ${standing.length} standing manual review(s)\n\nVendors without a machine-readable contract; repeated every run.\n\n${list(standing)}\n`;
            for (const mode of ['specs', 'docs', 'manual', 'records']) summary += `- ${mode}: ${report[mode].length} checks\n`;
          } catch {
            summary += `No complete JSON report was produced. Report step outcome: ${outcome || 'not run'}. See the job log and attached stderr.\n`;
          }
          appendFileSync(GITHUB_STEP_SUMMARY, summary);
          NODE
      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: provider-drift
          path: |
            ${{ runner.temp }}/provider-drift.json
            ${{ runner.temp }}/provider-drift.log
          if-no-files-found: warn
          retention-days: 30
