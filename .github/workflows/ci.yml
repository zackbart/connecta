name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# New commits supersede a PR run; pushes to main each retain their full gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      planning: ${{ steps.paths.outputs.planning }}
      browser: ${{ steps.paths.outputs.browser }}
      security: ${{ steps.paths.outputs.security }}
      goldens: ${{ steps.paths.outputs.goldens }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Decide which test, browser and dependency checks are needed
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          planning=false
          browser=true
          security=true
          goldens=full
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/paths"; then
              planning=$(bash scripts/ci-planning-paths.sh < "$RUNNER_TEMP/paths")
              browser=$(bash scripts/ci-browser-paths.sh < "$RUNNER_TEMP/paths")
              security=$(bash scripts/ci-security-paths.sh < "$RUNNER_TEMP/paths")
              # Classification failures must spend more CI, never skip the oracle.
              goldens=$(node scripts/ci-goldens-tier.mjs < "$RUNNER_TEMP/paths") || goldens=full
              if [[ "$goldens" != always ]]; then goldens=full; fi
            else
              echo "Path diff failed; running every check with full goldens." >&2
            fi
          fi
          echo "Provider goldens tier: $goldens"
          # A planning-only change has nothing for Chromium to exercise.
          if [[ "$planning" == true ]]; then browser=false; fi
          {
            echo "planning=$planning"
            echo "browser=$browser"
            echo "security=$security"
            echo "goldens=$goldens"
          } >> "$GITHUB_OUTPUT"

  # Keep every check:core check, but give both runtimes their own runner.
  # Static checks run for every change, including planning-only pull requests.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run check:providers-generated
      - run: pnpm run check:docs
      - run: pnpm run check:changes
      - run: pnpm run check:operator-ui
      - run: pnpm run check:clerk-sdk
      - run: pnpm run check:lint
      - run: pnpm run check:unused
      - run: pnpm run typecheck

  # Planning-only PRs still run the golden oracle on both runtimes, while
  # skipping the rest of the suites and the package build.
  node:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONNECTA_GOLDENS_TIER: ${{ needs.changes.outputs.goldens }}
      # PR checkout is a merge commit whose first parent is the PR base.
      # Pushes must compare before the entire push, even after main advances.
      CONNECTA_STANDARD_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Fetch the provider exemption comparison commit if needed
        run: |
          if [[ -z "$CONNECTA_STANDARD_BASE" || "$CONNECTA_STANDARD_BASE" =~ ^0+$ ]]; then
            echo "CONNECTA_STANDARD_BASE must be a real base SHA; first pushes fail closed." >&2
            exit 1
          fi
          if ! git cat-file -e "$CONNECTA_STANDARD_BASE^{commit}"; then
            git fetch --no-tags --depth=1 origin "$CONNECTA_STANDARD_BASE"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A Node-only config, not --project: retain invariant/spec enforcement.
      - if: needs.changes.outputs.planning != 'true'
        run: pnpm run test --config vitest.config.node.ts
      - if: needs.changes.outputs.planning == 'true'
        run: pnpm run test:node test/goldens.test.ts test/goldens-harness.test.ts

  workers:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONNECTA_GOLDENS_TIER: ${{ needs.changes.outputs.goldens }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.planning != 'true'
        run: pnpm run test:workers
      - if: needs.changes.outputs.planning == 'true'
        run: pnpm run test:workers test/goldens.test.ts test/goldens-harness.test.ts

  build:
    needs: changes
    if: needs.changes.outputs.planning != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:declarations
      # build already generated the UI. Run check:bundle's script directly: pnpm runs
      # its pre-hook even under --ignore-scripts.
      - run: node scripts/bundle-size.mjs
      - run: pnpm run check:examples
      # Reuse this job's dist/. Smoke packs with --ignore-scripts, without a rebuild.
      - run: pnpm run check:package

  # pnpm audit reads the lockfile and the registry, so it needs no install;
  # verify-deps-before-run=false stops pnpm run from installing first.
  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm --config.verify-deps-before-run=false run check:security

  # Gate the job, not the workflow, so irrelevant PRs report a skipped check.
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read installed Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      # Even a cache hit needs the runner's system libraries.
      - name: Install Chromium and system dependencies
        id: install
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm run test:browser:install --with-deps
      # A timed-out first attempt can leave apt-get holding the dpkg lock.
      - name: Retry Chromium installation once
        if: steps.install.outcome == 'failure'
        timeout-minutes: 9
        run: |
          bash scripts/ci-settle-apt.sh
          pnpm run test:browser:install --with-deps
      - name: Run browser tests
        run: pnpm run test:browser
      # test-results/ holds output only for failed attempts, flaky ones included.
      # A run that fails before any test still uploads its HTML report.
      - name: Upload Playwright report, diffs and traces
        if: ${{ !cancelled() && (failure() || hashFiles('test-results/**') != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  # Keep the existing check name as the gate for every job, even on failure.
  check:
    needs: [static, node, workers, build, changes, browser, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          NODE_RESULT: ${{ needs.node.result }}
          WORKERS_RESULT: ${{ needs.workers.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PLANNING_ONLY: ${{ needs.changes.outputs.planning }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SECURITY_REQUIRED: ${{ needs.changes.outputs.security }}
        run: |
          # A planning-only pull request skips build; both golden runtime jobs must pass.
          planned() { [[ "$1" == success || ( "$PLANNING_ONLY" == true && "$1" == skipped ) ]]; }
          if [[ "$STATIC_RESULT" == success && "$CHANGES_RESULT" == success ]] &&
             [[ "$NODE_RESULT" == success && "$WORKERS_RESULT" == success ]] && planned "$BUILD_RESULT" &&
             [[ "$BROWSER_RESULT" == success || ( "$BROWSER_REQUIRED" == false && "$BROWSER_RESULT" == skipped ) ]] &&
             [[ "$SECURITY_RESULT" == success || ( "$SECURITY_REQUIRED" == false && "$SECURITY_RESULT" == skipped ) ]]; then
            echo "All required checks passed"
          else
            echo "Static=$STATIC_RESULT node=$NODE_RESULT workers=$WORKERS_RESULT build=$BUILD_RESULT planning=$PLANNING_ONLY changes=$CHANGES_RESULT browser=$BROWSER_RESULT required=$BROWSER_REQUIRED security=$SECURITY_RESULT required=$SECURITY_REQUIRED"
            exit 1
          fi
