name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run release:check

  current-version-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            eval/current-version/package-lock.json
      - run: npm ci
      - run: npm ci --prefix eval/current-version
      - run: npm --prefix eval/current-version run check
      - name: Run the current-version release audit
        run: |
          npm --prefix eval/current-version run audit -- \
            --output "$RUNNER_TEMP/current-version.json" \
            --report "$RUNNER_TEMP/current-version.md"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the example image
        run: docker build -f examples/docker/Dockerfile -t connecta-example .
      - name: Smoke-test /health
        run: |
          docker run -d --rm --name connecta \
            -e CONNECTA_TOKEN=ci-smoke-token -p 8787:8787 connecta-example
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              docker stop connecta
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs connecta
          exit 1
