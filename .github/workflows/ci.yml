name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # release:check ends in the package smoke, which packs the tarball, runs
      # `connecta init`, and then builds and runs the generated deployment's own
      # container. Runners have Docker, and the smoke fails rather than skips
      # when CI is set — so there is no separate image job to drift from it.
      - run: npm run release:check

  current-version-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            eval/current-version/package-lock.json
      - run: npm ci
      - run: npm ci --prefix eval/current-version
      - run: npm --prefix eval/current-version run check
      - name: Run the current-version release audit
        run: |
          npm --prefix eval/current-version run audit -- \
            --output "$RUNNER_TEMP/current-version.json" \
            --report "$RUNNER_TEMP/current-version.md"
