name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `check` runs the operator-page browser suite, which needs Chromium and
      # the system libraries it links against.
      - run: npm run test:browser:install -- --with-deps
      # release:check ends in the package smoke, which packs the tarball, runs
      # `connecta init`, and then builds and runs the generated deployment's own
      # container. Runners have Docker, and the smoke fails rather than skips
      # when CI is set — so there is no separate image job to drift from it.
      - run: npm run release:check
