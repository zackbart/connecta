name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede a PR run; pushes to main each retain their full gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every change runs build/installed-consumer, runtime, outcome, browser, audit
# and Eve compatibility checks. `check` is the only required status.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - run: pnpm run check:static
      - run: pnpm run check:build
      - run: pnpm run check:examples
      - name: Verify installed consumers and Docker deployment
        env:
          CONNECTA_REQUIRE_DOCKER: "1"
        run: pnpm run check:package

  # Retained fault probes complement deployed behavior journeys.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - run: pnpm run test:node

  # workerd runs only the suites vitest.config.ts lists for it.
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - run: pnpm run test:workers

  # Outcome references, then the Node template, Node eval and native workerd
  # deployments with the operator page. No model, login or network service.
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - run: pnpm run eval:outcomes
      - name: Install Chromium and system dependencies
        timeout-minutes: 16
        uses: ./.github/actions/install-chromium
      - run: pnpm run eval:smoke --out eval/results/smoke.json
      - name: Upload eval diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: eval-diagnostics
          path: eval/results/
          if-no-files-found: warn
          retention-days: 14

  eve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/connecta-eve/pnpm-lock.yaml
      # The integration test runs the in-repo agent endpoint, so install core too.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zackbart/connecta-eve run check
      - run: pnpm run check:eve-package

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - name: Install Chromium and system dependencies
        timeout-minutes: 16
        uses: ./.github/actions/install-chromium
      - name: Run browser tests
        run: pnpm run test:browser
      # test-results/ holds output only for failed attempts, flaky ones included.
      # A run that fails before any test still uploads its HTML report.
      - name: Upload Playwright report, diffs and traces
        if: ${{ !cancelled() && (failure() || hashFiles('test-results/**') != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm --config.verify-deps-before-run=false run check:security
      - run: pnpm --config.verify-deps-before-run=false run check:security:eve

  # Branch protection requires this name. Every job must finish successfully;
  # failures, cancellations, missing jobs and unexpected skips fail the gate.
  check:
    needs: [build, node, workers, behavior, browser, audit, eve]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '
            . as $jobs |
            all(["build", "node", "workers", "behavior", "browser", "audit", "eve"][];
              $jobs[.].result == "success")
          ' <<< "$NEEDS" > /dev/null
