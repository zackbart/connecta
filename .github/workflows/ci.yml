name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# New commits supersede a PR run; pushes to main each retain their full gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.paths.outputs.browser }}
      security: ${{ steps.paths.outputs.security }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether browser and dependency checks are needed
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          browser=true
          security=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/paths"
            browser=$(bash scripts/ci-browser-paths.sh < "$RUNNER_TEMP/paths")
            security=$(bash scripts/ci-security-paths.sh < "$RUNNER_TEMP/paths")
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "security=$security" >> "$GITHUB_OUTPUT"

  # Keep every check:core check, but give both runtimes their own runner.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:providers-generated
      - run: npm run check:docs
      - run: npm run check:changes
      - run: npm run check:operator-ui
      - run: npm run check:clerk-sdk
      - run: npm run check:lint
      - run: npm run check:unused
      - run: npm run typecheck

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A Node-only config, not --project: retain invariant/spec enforcement.
      - run: npm run test -- --config vitest.config.node.ts

  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:workers

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:declarations
      # build already generated the UI; avoid check:bundle's duplicate prehook.
      - run: npm --ignore-scripts run check:bundle
      - run: npm run check:examples
      # Reuse this job's dist/. Smoke packs with --ignore-scripts, without a rebuild.
      - run: npm run check:package

  # npm audit reads the lockfile and the registry, so it needs no install.
  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check:security

  # Gate the job, not the workflow, so irrelevant PRs report a skipped check.
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read installed Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      # Even a cache hit needs the runner's system libraries.
      - name: Install Chromium and system dependencies
        id: install
        timeout-minutes: 5
        continue-on-error: true
        run: npm run test:browser:install -- --with-deps
      # A timed-out first attempt can leave apt-get holding the dpkg lock.
      - name: Retry Chromium installation once
        if: steps.install.outcome == 'failure'
        timeout-minutes: 9
        run: |
          bash scripts/ci-settle-apt.sh
          npm run test:browser:install -- --with-deps
      - run: npm run test:browser

  # Keep the existing check name as the gate for every job, even on failure.
  check:
    needs: [static, node, workers, build, changes, browser, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          NODE_RESULT: ${{ needs.node.result }}
          WORKERS_RESULT: ${{ needs.workers.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SECURITY_REQUIRED: ${{ needs.changes.outputs.security }}
        run: |
          if [[ "$STATIC_RESULT" == success && "$NODE_RESULT" == success &&
                "$WORKERS_RESULT" == success && "$BUILD_RESULT" == success && "$CHANGES_RESULT" == success ]] &&
             [[ "$BROWSER_RESULT" == success || ( "$BROWSER_REQUIRED" == false && "$BROWSER_RESULT" == skipped ) ]] &&
             [[ "$SECURITY_RESULT" == success || ( "$SECURITY_REQUIRED" == false && "$SECURITY_RESULT" == skipped ) ]]; then
            echo "All required checks passed"
          else
            echo "Static=$STATIC_RESULT node=$NODE_RESULT workers=$WORKERS_RESULT build=$BUILD_RESULT changes=$CHANGES_RESULT browser=$BROWSER_RESULT required=$BROWSER_REQUIRED security=$SECURITY_RESULT required=$SECURITY_REQUIRED"
            exit 1
          fi
