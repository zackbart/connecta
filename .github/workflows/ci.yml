name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede a PR run; pushes to main each retain their full gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every core check runs for every change. Share static/build setup; `check`
# is the only required status. Applicable browser/audit/Eve failures also block it.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed-files: ${{ steps.changes.outcome }}
      browser: ${{ steps.changes.outputs.browser }}
      audit: ${{ steps.changes.outputs.audit }}
      eve: ${{ steps.changes.outputs.eve }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select browser, audit and Eve checks
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          base=${PR_BASE:-${PUSH_BASE:-HEAD^1}}
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" != pull_request ]]; then
            printf '%s\n' 'browser=true' 'audit=true' 'eve=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$PR_BASE"
          git fetch --no-tags --depth=1 origin "$PR_BASE"
          git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed-files"
          # Canonical browser input list. The build reads operator-ui/{app,styles},
          # tokens/page CSS, fonts and LICENSE. Playwright fixtures import the real
          # server through helpers.ts, so src/ covers their shared auth/routes/core;
          # fixtures/helpers cover their local dependencies; node.ts uses bin/ tool names.
          if grep -zEq '^(src/|bin/|test/(browser/|fixtures/|helpers/|helpers\.ts$)|scripts/(build-operator-ui\.mjs|ci-settle-apt\.sh)$|playwright[^/]*\.config\.[^/]+$|tsconfig[^/]*\.json$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|LICENSE$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed-files"; then
            echo 'browser=true' >> "$GITHUB_OUTPUT"
          else
            echo 'browser=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -zEq '(^|/)(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc)$|^\.github/workflows/ci\.yml$' "$RUNNER_TEMP/changed-files"; then
            echo 'audit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'audit=false' >> "$GITHUB_OUTPUT"
          fi
          # The helper's integration test imports the real agent server. Any
          # core change can change that contract; keep its Node 24 check separate.
          if grep -zEq '^(packages/connecta-eve/|src/|scripts/check-eve-package\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|\.github/workflows/(ci|publish)\.yml$)' "$RUNNER_TEMP/changed-files"; then
            echo 'eve=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eve=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Reject new provider exemptions (decision 0011)
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: |
          test -n "$BASE"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
          git show "$BASE:test/provider-pending-baseline.json" | node scripts/check-provider-exemptions.mjs
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - run: pnpm run check:static
      - run: pnpm run check:build

  # The unfiltered Node run also enforces invariant and spec coverage.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - run: pnpm run test:node

  # workerd runs only the suites vitest.config.ts lists for it.
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - run: pnpm run test:workers

  # Outcome references, then the Node template, Node eval and native workerd
  # deployments with the operator page. No model, login or network service.
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - run: pnpm run eval:outcomes
      - name: Install Chromium and system dependencies
        timeout-minutes: 16
        uses: ./.github/actions/install-chromium
      - run: pnpm run eval:smoke --out eval/results/smoke.json
      - name: Upload eval diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: eval-diagnostics
          path: eval/results/
          if-no-files-found: warn
          retention-days: 14

  eve:
    needs: static
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.static.outputs.eve == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/connecta-eve/pnpm-lock.yaml
      # The integration test runs the in-repo agent endpoint, so install core too.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zackbart/connecta-eve run check
      - run: pnpm run check:eve-package

  browser:
    needs: static
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.static.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @zackbart/connecta install --frozen-lockfile
      - name: Install Chromium and system dependencies
        timeout-minutes: 16
        uses: ./.github/actions/install-chromium
      - name: Run browser tests
        run: pnpm run test:browser
      # test-results/ holds output only for failed attempts, flaky ones included.
      # A run that fails before any test still uploads its HTML report.
      - name: Upload Playwright report, diffs and traces
        if: ${{ !cancelled() && (failure() || hashFiles('test-results/**') != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  audit:
    needs: static
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.static.outputs.audit == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm --config.verify-deps-before-run=false run check:security
      - run: pnpm --config.verify-deps-before-run=false run check:security:eve

  # Branch protection requires this name. Core jobs and classification must
  # succeed; browser/audit/Eve may skip only when explicitly inapplicable.
  check:
    needs: [static, node, workers, behavior, browser, audit, eve]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require core and applicable checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '
            . as $jobs |
            all(["static", "node", "workers", "behavior"][]; $jobs[.].result == "success") and
            .static.outputs["changed-files"] == "success" and
            all(["browser", "audit", "eve"][];
              . as $job | $jobs.static.outputs[$job] as $applies |
              ($applies == "true" and $jobs[$job].result == "success") or
              ($applies == "false" and $jobs[$job].result == "skipped"))
          ' <<< "$NEEDS" > /dev/null
